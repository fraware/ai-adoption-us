name: Apply strict typing repairs v2

on:
  push:
    branches: [import/genai-at-work-handoff]
    paths:
      - .github/workflows/apply-mypy-fixes-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out handoff branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: import/genai-at-work-handoff
          fetch-depth: 0

      - name: Apply reviewed deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-mypy-fixes.yml').read_text()
          anchor = workflow.index("python - <<'PY'")
          start = workflow.index('          from pathlib import Path\n', anchor)
          end = workflow.index('\n          PY\n', start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'strict-typing-repair', 'exec'), {})

          models = Path('src/genai_at_work/models.py')
          text = models.read_text()
          old = 'from datetime import date as Date, datetime\n'
          new = 'from datetime import date as Date\nfrom datetime import datetime\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one combined Date/datetime import after repair')
          models.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate repaired source before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q
          python -m compileall -q src scripts
          ruff check src tests scripts
          mypy src
          git diff --check

      - name: Commit repaired source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && { echo 'No source changes to commit.'; exit 1; }
          git commit -m 'Make research source strict-mypy clean'
          git push origin HEAD:import/genai-at-work-handoff
