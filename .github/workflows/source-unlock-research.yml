name: OEWS and CPS vintage robustness

on:
  push:
    branches:
      - research/oews-rps-source-unlock

permissions:
  contents: write

jobs:
  validate-and-execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and research dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install requests==2.32.5

      - name: Validate implementation before source access
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q \
            tests/test_oews.py \
            tests/test_oews_partial.py \
            tests/test_cps.py \
            tests/test_cps_historical.py \
            tests/test_composition.py
          ruff check src tests scripts
          mypy src

      - name: Execute Q2 2025 CPS composition
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/execute_cps_2025_composition.py \
            --quarter 2 \
            --input-dir /tmp/cps-q2-2025 \
            --output-dir data/derived/composition/cps-q2-2025 \
            --validation-report docs/validation/CPS_2025_Q2_COMPOSITION_EXECUTION.md \
            --coverage-gate 0.98 \
            --download-missing \
            --source-build-commit "$SOURCE_BUILD_COMMIT"

      - name: Validate OEWS sector identifiers
        run: |
          set -euo pipefail
          python scripts/probe_oews_series_ids.py \
            --output docs/validation/source-unlock-2026-09-01/oews_series_id_probe.json

      - name: Execute May 2025 OEWS composition
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/execute_oews_composition.py \
            --year 2025 \
            --coverage-gate 0.98 \
            --output-dir data/derived/composition/oews-may-2025 \
            --cps-composition data/derived/composition/cps-q2-2026/cps_composition.json \
            --validation-report docs/validation/OEWS_MAY_2025_CPS_ROBUSTNESS.md \
            --source-build-commit "$SOURCE_BUILD_COMMIT"

      - name: Compare OEWS against Q2 2025 and Q2 2026 CPS
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/compare_oews_cps_vintages.py \
            --oews-composition data/derived/composition/oews-may-2025/oews_composition.json \
            --cps-2025 data/derived/composition/cps-q2-2025/cps_composition.json \
            --cps-2026 data/derived/composition/cps-q2-2026/cps_composition.json \
            --occupation-crosswalk data/registry/oews_occupation_crosswalk_v1.json \
            --output-dir data/derived/composition/oews-may-2025-cross-vintage \
            --validation-report docs/validation/OEWS_MAY_2025_CPS_VINTAGE_ROBUSTNESS.md \
            --source-build-commit "$SOURCE_BUILD_COMMIT"

      - name: Verify raw source data remain outside the repository
        run: |
          set -euo pipefail
          if find . -type f \( \
            -name '*pub.dat.gz' -o \
            -name 'oesm25in4.zip' -o \
            -name '*.dta' -o \
            -name '*.sav' -o \
            -name '*.sas7bdat' \
          \) | grep -q .; then
            echo 'Raw source data unexpectedly entered repository worktree.' >&2
            exit 1
          fi

      - name: Commit derived validation evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/derived/composition/cps-q2-2025 \
            data/derived/composition/oews-may-2025 \
            data/derived/composition/oews-may-2025-cross-vintage \
            docs/validation/source-unlock-2026-09-01/oews_series_id_probe.json \
            docs/validation/CPS_2025_Q2_COMPOSITION_EXECUTION.md \
            docs/validation/OEWS_MAY_2025_CPS_ROBUSTNESS.md \
            docs/validation/OEWS_MAY_2025_CPS_VINTAGE_ROBUSTNESS.md
          if git diff --cached --quiet; then
            echo 'No derived validation evidence changes to commit.'
            exit 0
          fi
          git commit -m 'Execute OEWS and CPS vintage robustness'
          git push origin HEAD:research/oews-rps-source-unlock
