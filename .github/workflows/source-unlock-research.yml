name: OEWS and RPS source reconnaissance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and research dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install openpyxl==3.1.5 requests==2.32.5

      - name: Validate OEWS implementation
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q tests/test_oews.py tests/test_cps.py tests/test_composition.py
          ruff check src tests scripts
          mypy src

      - name: Inspect source access and identifiers
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/inspect_external_source_packages.py \
            --output-dir docs/validation/source-unlock-2026-09-01
          python scripts/probe_oews_series_ids.py \
            --output docs/validation/source-unlock-2026-09-01/oews_series_id_probe.json

      - name: Execute May 2025 OEWS composition robustness
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/execute_oews_composition.py \
            --year 2025 \
            --coverage-gate 0.98 \
            --output-dir data/derived/composition/oews-may-2025 \
            --cps-composition data/derived/composition/cps-q2-2026/cps_composition.json \
            --validation-report docs/validation/OEWS_MAY_2025_CPS_ROBUSTNESS.md \
            --source-build-commit "$SOURCE_BUILD_COMMIT"

      - name: Verify no raw source packages entered the worktree
        run: |
          set -euo pipefail
          if find . -type f \( -name 'oesm25in4.zip' -o -name '*.dta' -o -name '*.sav' -o -name '*.sas7bdat' \) | grep -q .; then
            echo 'Raw source package or microdata unexpectedly entered repository worktree.' >&2
            exit 1
          fi

      - name: Commit derived research evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/source-unlock-2026-09-01 \
            data/derived/composition/oews-may-2025 \
            docs/validation/OEWS_MAY_2025_CPS_ROBUSTNESS.md
          if git diff --cached --quiet; then
            echo 'No research evidence changes to commit.'
            exit 0
          fi
          git commit -m 'Execute May 2025 OEWS composition robustness'
          git push origin HEAD:research/oews-rps-source-unlock
