name: OEWS and RPS source reconnaissance

on:
  push:
    branches:
      - research/oews-rps-source-unlock

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install inspection dependencies
        run: python -m pip install openpyxl==3.1.5 requests==2.32.5

      - name: Inspect source packages
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/inspect_external_source_packages.py \
            --output-dir docs/validation/source-unlock-2026-09-01

      - name: Verify no raw source packages entered the worktree
        run: |
          set -euo pipefail
          if find . -type f \( -name 'oesm25in4.zip' -o -name '*.dta' -o -name '*.sav' -o -name '*.sas7bdat' \) | grep -q .; then
            echo 'Raw source package or microdata unexpectedly entered repository worktree.' >&2
            exit 1
          fi

      - name: Commit source reconnaissance manifests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/source-unlock-2026-09-01
          if git diff --cached --quiet; then
            echo 'No source reconnaissance changes to commit.'
            exit 0
          fi
          git commit -m 'Inspect OEWS and RPS source packages'
          git push origin HEAD:research/oews-rps-source-unlock
