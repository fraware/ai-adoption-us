name: CPS occupation direct-SE probe

on:
  push:
    branches:
      - research/cps-gvf-lender-calibration
    paths:
      - '.github/workflows/cps-occupation-se-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Retrieve July 2026 BLS occupation estimates and SE aspects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Retrieve occupation-family direct SEs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = 'https://api.bls.gov/publicAPI/v2/timeseries/data/'
          rows = []
          for suffix in range(1, 21):
              series_id = f'LNU020322{suffix:02d}'
              url = f'{base}{series_id}?aspects=true'
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'ai-adoption-us/1.0 public-data-validation'},
              )
              row = {'series_id': series_id, 'request_url': url}
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  row['retrieval_error_type'] = 'HTTPError'
                  row['retrieval_error'] = exc.code
                  rows.append(row)
                  continue
              except urllib.error.URLError as exc:
                  row['retrieval_error_type'] = 'URLError'
                  row['retrieval_error'] = str(exc.reason)
                  rows.append(row)
                  continue

              row.update({
                  'transport_response_sha256': hashlib.sha256(raw).hexdigest(),
                  'transport_response_size_bytes': len(raw),
              })
              try:
                  payload = json.loads(raw.decode('utf-8'))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  row['parse_error_type'] = type(exc).__name__
                  row['parse_error'] = str(exc)
                  rows.append(row)
                  continue

              row['status'] = payload.get('status')
              row['message'] = payload.get('message')
              results = payload.get('Results')
              series = results.get('series', []) if isinstance(results, dict) else []
              matching_series = [
                  item for item in series
                  if isinstance(item, dict) and item.get('seriesID') == series_id
              ]
              if len(matching_series) == 1:
                  observations = matching_series[0].get('data', [])
                  matches = [
                      item for item in observations
                      if isinstance(item, dict)
                      and item.get('year') == '2026'
                      and item.get('period') == 'M07'
                  ]
                  if len(matches) == 1:
                      observation = matches[0]
                      raw_value = observation.get('value')
                      try:
                          row['value_thousands'] = float(str(raw_value).replace(',', ''))
                      except ValueError:
                          row['value_parse_error'] = repr(raw_value)
                      aspects = observation.get('aspects', [])
                      se = [
                          item for item in aspects
                          if isinstance(item, dict)
                          and str(item.get('name', '')).strip().casefold() == 'standard error'
                      ]
                      if len(se) == 1:
                          raw_se = se[0].get('value')
                          try:
                              row['standard_error_thousands'] = float(
                                  str(raw_se).replace(',', '')
                              )
                          except ValueError:
                              row['standard_error_parse_error'] = repr(raw_se)
                          row['standard_error_footnotes'] = se[0].get('footnotes', [])
                      else:
                          row['standard_error_match_count'] = len(se)
                  else:
                      row['reference_period_match_count'] = len(matches)
              else:
                  row['series_match_count'] = len(matching_series)
              rows.append(row)

          result = {
              'schema_version': 1,
              'reference_period': '2026-M07',
              'series_family_probe': 'LNU02032201 through LNU02032220',
              'raw_api_responses_published': False,
              'rows': rows,
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'cps-occupation-se-probe.json'
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload rights-safe direct-SE probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cps-occupation-se-probe-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/cps-occupation-se-probe.json
          retention-days: 14
          if-no-files-found: warn
