name: CPS composition reliability research

on:
  push:
    branches:
      - research/oews-rps-source-unlock

permissions:
  contents: write

jobs:
  validate-and-execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and development checks
        run: python -m pip install -e '.[dev]'

      - name: Validate implementation before source access
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q \
            tests/test_cps.py \
            tests/test_cps_historical.py \
            tests/test_cps_reliability.py \
            tests/test_composition.py
          ruff check src tests scripts
          mypy src

      - name: Execute Census-only reliability diagnostics
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/execute_cps_composition_reliability.py \
            --input-2025 /tmp/cps-reliability-2025 \
            --input-2026 /tmp/cps-reliability-2026 \
            --reference-2025 data/derived/composition/cps-q2-2025/cps_composition.json \
            --reference-2026 data/derived/composition/cps-q2-2026/cps_composition.json \
            --output-dir data/derived/composition/cps-q2-reliability \
            --validation-report docs/validation/CPS_Q2_COMPOSITION_RELIABILITY.md \
            --source-build-commit "$SOURCE_BUILD_COMMIT"

      - name: Verify raw CPS source files remain outside repository
        run: |
          set -euo pipefail
          if find . -type f -name '*pub.dat.gz' | grep -q .; then
            echo 'Raw CPS source file unexpectedly entered repository worktree.' >&2
            exit 1
          fi

      - name: Commit derived reliability evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/derived/composition/cps-q2-reliability \
            docs/validation/CPS_Q2_COMPOSITION_RELIABILITY.md
          if git diff --cached --quiet; then
            echo 'No derived reliability changes to commit.'
            exit 0
          fi
          git commit -m 'Execute CPS composition reliability diagnostics'
          git push origin HEAD:research/oews-rps-source-unlock

# One-shot research workflow; remove after the derived checkpoint is committed.
