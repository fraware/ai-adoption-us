name: Publish Release 1

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  issues: read

jobs:
  publish-release-1:
    name: Publish audited v1.0.0 release
    if: startsWith(github.event.head_commit.message, 'Authorize Release 1 publication')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact publication commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'

      - name: Wait for exact-head release gates and publish Release 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/publish_release1.py
