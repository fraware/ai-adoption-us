name: RPS aggregate source watch

on:
  pull_request:
    paths:
      - 'src/genai_at_work/rps_refresh.py'
      - 'src/genai_at_work/sources/fred.py'
      - 'scripts/probe_rps_aggregate_sources.py'
      - 'tests/test_rps_refresh.py'
      - 'data/registry/rps_source_series_manifest.json'
      - 'data/registry/rps_provider_catalog_scope.json'
      - 'data/registry/rps_industry_adoption_q2_2026_v1.json'
      - 'docs/source-rights/RPS_SOURCE_DECISION.md'
      - '.github/workflows/rps-source-watch.yml'
  push:
    branches: [main]
    paths:
      - 'src/genai_at_work/rps_refresh.py'
      - 'src/genai_at_work/sources/fred.py'
      - 'scripts/probe_rps_aggregate_sources.py'
      - 'tests/test_rps_refresh.py'
      - 'data/registry/rps_source_series_manifest.json'
      - 'data/registry/rps_provider_catalog_scope.json'
      - 'data/registry/rps_industry_adoption_q2_2026_v1.json'
      - 'docs/source-rights/RPS_SOURCE_DECISION.md'
      - '.github/workflows/rps-source-watch.yml'
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rps-source-watch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate RPS source-watch contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and test dependency
        run: python -m pip install -e '.[dev]'

      - name: Run RPS refresh contract tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: PYTHONPATH=src pytest -q tests/test_rps_refresh.py tests/test_rps_provider_scope.py

  source-watch:
    name: Probe authorized RPS aggregate distribution
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Probe release and observations into review evidence
        id: probe
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          PYTHONPATH=src python scripts/probe_rps_aggregate_sources.py
          --output "$RUNNER_TEMP/rps-source-watch/rps-refresh-candidate.json"

      - name: Upload non-canonical RPS source-watch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rps-source-watch-${{ github.sha }}
          path: ${{ runner.temp }}/rps-source-watch
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce successful source probe
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" != "success" ]; then
            echo "RPS source watch failed or is not configured; inspect the uploaded evidence/logs." >&2
            exit 1
          fi
