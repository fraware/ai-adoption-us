name: Content-only Pages publication

on:
  pull_request:
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/tests/**'
      - 'apps/web/scripts/native-safari-qa.mjs'
      - 'scripts/validate_content_publication_commit.py'
      - '.github/workflows/content-pages.yml'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      content_publication_sha:
        description: Exact canonical main commit to publish over the unchanged promoted Observatory evidence
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-build:
    name: Validate content boundary and build Pages artifact
    runs-on: ubuntu-24.04
    env:
      DATA_MODE: derived_only
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_SITE_URL: https://fraware.github.io/ai-adoption-us
      CONTENT_COMMIT_SHA: ${{ inputs.content_publication_sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact content tree with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.content_publication_sha || github.sha }}
          fetch-depth: 0

      - name: Require canonical main identity for publication dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$CONTENT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$|^[0-9a-fA-F]{64}$ ]]; then
            echo 'content_publication_sha must be a full Git commit SHA.' >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$CONTENT_COMMIT_SHA" ]; then
            echo 'Content publication checkout does not match requested SHA.' >&2
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CONTENT_COMMIT_SHA" ]; then
            echo 'Content publication SHA is not the current canonical main commit.' >&2
            exit 1
          fi

      - name: Validate presentation-only evidence boundary
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/validate_content_publication_commit.py \
            --commit "$CONTENT_COMMIT_SHA" \
            | tee content-publication-validation.json

      - name: Require successful exact-tree QA evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          web_sha=$(git log -1 --format=%H "$CONTENT_COMMIT_SHA" -- apps/web)
          test -n "$web_sha"
          export WEB_CONTENT_SHA="$web_sha"
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          content_sha = os.environ['CONTENT_COMMIT_SHA']
          web_sha = os.environ['WEB_CONTENT_SHA']

          def runs(sha):
              url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)['workflow_runs']

          def require_success(name, sha):
              matching = [
                  row for row in runs(sha)
                  if row.get('name') == name
                  and row.get('event') == 'push'
                  and row.get('conclusion') == 'success'
              ]
              if not matching:
                  raise SystemExit(f'No successful push run for {name!r} at {sha}')
              return max(row['id'] for row in matching)

          evidence = {
              'content_commit': content_sha,
              'web_content_commit': web_sha,
              'release_candidate_ci_run': require_success('Release candidate CI', content_sha),
              'rendered_browser_qa_run': require_success('Rendered browser and accessibility QA', web_sha),
              'native_safari_qa_run': require_success('Native Safari desktop QA', web_sha),
          }
          with open('content-publication-qa-evidence.json', 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript and build static Pages export
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm run lint
          RELEASE_COMMIT_SHA="$CONTENT_COMMIT_SHA" npm run build

      - name: Audit content-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          test -f apps/web/out/404.html
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          test -f apps/web/out/release-manifest.json
          touch apps/web/out/.nojekyll

          if find apps/web/out -path '*data/audit/private*' -print | grep -q .; then
            echo 'Private audit path found in content publication artifact.' >&2
            exit 1
          fi
          if grep -R --binary-files=text -E 'rps_subgroup_5q_audit|data/audit/private|FRED_API_KEY' apps/web/out >/dev/null 2>&1; then
            echo 'Private/raw/secret identifier leaked into content publication artifact.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('apps/web/out/release-manifest.json').read_text())
          expected = {
              'hostingTarget': 'github-pages',
              'dataMode': 'derived_only',
              'commitSha': os.environ['CONTENT_COMMIT_SHA'],
              'siteBaseUrl': 'https://fraware.github.io/ai-adoption-us',
              'analytics': 'disabled',
              'clientMonitoring': 'disabled',
              'sourceBytesPublished': False,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}')
          PY

          grep -F 'https://fraware.github.io/ai-adoption-us/sitemap.xml' apps/web/out/robots.txt >/dev/null
          for url in \
            https://fraware.github.io/ai-adoption-us/ \
            https://fraware.github.io/ai-adoption-us/explore \
            https://fraware.github.io/ai-adoption-us/explore/industries \
            https://fraware.github.io/ai-adoption-us/explore/occupations \
            https://fraware.github.io/ai-adoption-us/blog/after-adoption \
            https://fraware.github.io/ai-adoption-us/methodology \
            https://fraware.github.io/ai-adoption-us/sources; do
            grep -F "$url" apps/web/out/sitemap.xml >/dev/null
          done

      - name: Upload content-publication validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-publication-validation-${{ github.sha }}
          path: |
            content-publication-validation.json
            content-publication-qa-evidence.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/out

  deploy:
    name: Deploy content-only GitHub Pages publication
    if: github.event_name == 'workflow_dispatch'
    needs: validate-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-audit:
    name: Audit deployed content-only publication
    if: github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE_URL: https://fraware.github.io/ai-adoption-us
      DEPLOYED_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_COMMIT_SHA: ${{ inputs.content_publication_sha }}
    steps:
      - name: Audit live GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit
          normalized_deployed="${DEPLOYED_PAGE_URL%/}"
          if [ "$normalized_deployed" != "$EXPECTED_BASE_URL" ]; then
            echo "Unexpected deployed page URL: $DEPLOYED_PAGE_URL" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error "$EXPECTED_BASE_URL/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'GitHub Pages origin did not become reachable.' >&2
              exit 1
            fi
            sleep 2
          done

          routes=(
            /
            /explore/
            /explore/industries/
            /explore/occupations/
            /blog/after-adoption/
            /methodology/
            /sources/
            /robots.txt
            /sitemap.xml
            /release-manifest.json
          )
          for route in "${routes[@]}"; do
            filename=$(echo "$route" | tr '/.' '__')
            curl --fail --location --silent --show-error \
              --dump-header "live-audit/${filename}.headers.txt" \
              --output "live-audit/${filename}.body.txt" \
              "$EXPECTED_BASE_URL$route"
          done

          cp live-audit/_release-manifest_json.body.txt live-audit/release-manifest.json
          cp live-audit/_robots_txt.body.txt live-audit/robots.txt
          cp live-audit/_sitemap_xml.body.txt live-audit/sitemap.xml

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('live-audit/release-manifest.json').read_text())
          expected = {
              'hostingTarget': 'github-pages',
              'dataMode': 'derived_only',
              'commitSha': os.environ['EXPECTED_COMMIT_SHA'],
              'siteBaseUrl': os.environ['EXPECTED_BASE_URL'],
              'analytics': 'disabled',
              'clientMonitoring': 'disabled',
              'sourceBytesPublished': False,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'live manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}')
          PY

          homepage='live-audit/_.body.txt'
          if grep -Eiq 'googletagmanager|google-analytics|segment\.com|mixpanel|posthog|sentry|datadog|newrelic' "$homepage"; then
            echo 'Unexpected third-party analytics/monitoring identifier found in delivered homepage.' >&2
            exit 1
          fi
          if grep -Eiq 'data/audit/private|rps_subgroup_5q_audit|FRED_API_KEY' "$homepage" live-audit/release-manifest.json; then
            echo 'Private/raw/secret identifier found in delivered public content.' >&2
            exit 1
          fi

          for private_path in \
            /data/audit/private/rps_subgroup_5q_audit.json \
            /rps_subgroup_5q_audit.json \
            /api/rps/raw; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$EXPECTED_BASE_URL$private_path")
            if [ "$status" != '404' ]; then
              echo "Private/raw path did not fail closed on GitHub Pages: ${private_path} -> ${status}" >&2
              exit 1
            fi
          done

          {
            echo "audit_timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "commit_sha=$EXPECTED_COMMIT_SHA"
            echo "deployed_page_url=$DEPLOYED_PAGE_URL"
            echo 'publication_mode=content_only_over_unchanged_promoted_evidence'
          } > live-audit/summary.txt

      - name: Upload live content-publication audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-publication-live-audit-${{ inputs.content_publication_sha }}
          path: live-audit
          if-no-files-found: error
          retention-days: 90
