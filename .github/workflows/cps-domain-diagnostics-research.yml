name: CPS domain stability diagnostics

on:
  push:
    branches:
      - research/oews-rps-source-unlock

permissions:
  contents: write

jobs:
  validate-and-execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and checks
        run: python -m pip install -e '.[dev]'

      - name: Validate implementation before source access
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q \
            tests/test_cps.py \
            tests/test_cps_historical.py \
            tests/test_cps_domain_diagnostics.py \
            tests/test_composition.py
          ruff check src tests scripts
          mypy src

      - name: Execute Q2 2025 and Q2 2026 CPS domain diagnostics
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/execute_cps_domain_diagnostics.py \
            --input-root /tmp/cps-domain-diagnostics \
            --cross-year-comparison data/derived/composition/oews-may-2025-cross-vintage/cps_q2_2025_vs_q2_2026.csv \
            --output-dir data/derived/composition/cps-domain-diagnostics-q2-2025-q2-2026 \
            --validation-report docs/validation/CPS_Q2_2025_Q2_2026_DOMAIN_STABILITY.md \
            --source-build-commit "$SOURCE_BUILD_COMMIT"

      - name: Verify raw CPS files remain outside the repository
        run: |
          set -euo pipefail
          if find . -type f -name '*pub.dat.gz' | grep -q .; then
            echo 'Raw CPS Basic Monthly file unexpectedly entered repository worktree.' >&2
            exit 1
          fi

      - name: Commit derived diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/derived/composition/cps-domain-diagnostics-q2-2025-q2-2026 \
            docs/validation/CPS_Q2_2025_Q2_2026_DOMAIN_STABILITY.md
          if git diff --cached --quiet; then
            echo 'No derived CPS diagnostics changed.'
            exit 0
          fi
          git commit -m 'Execute CPS domain stability diagnostics'
          git push origin HEAD:research/oews-rps-source-unlock
