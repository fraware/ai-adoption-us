name: Bootstrap R1-G2 browser QA lockfile

on:
  push:
    branches:
      - qa/r1-g2-automated-browser-baseline

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Resolve pinned QA dependencies into lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean package resolution
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches package.json.'
            exit 0
          fi
          git commit -m 'Lock browser QA dependencies'
          git push origin HEAD:qa/r1-g2-automated-browser-baseline
