name: GitHub Pages Release 1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_sha:
        description: Exact validated Observatory publication commit to deploy; required for release dispatch
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and audit GitHub Pages artifact
    runs-on: ubuntu-24.04
    env:
      DATA_MODE: derived_only
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_SITE_URL: https://fraware.github.io/ai-adoption-us
      RELEASE_COMMIT_SHA: ${{ inputs.publication_sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publication_sha || github.sha }}
          fetch-depth: 2

      - name: Validate exact dispatched publication identity
        if: github.event_name == 'workflow_dispatch' && inputs.publication_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$|^[0-9a-fA-F]{64}$ ]]; then
            echo 'publication_sha must be a full Git commit SHA.' >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT_SHA" ]; then
            echo 'Pages dispatch checkout does not match publication_sha.' >&2
            exit 1
          fi
          git fetch origin main --depth=2
          if [ "$(git rev-parse origin/main)" != "$RELEASE_COMMIT_SHA" ]; then
            echo 'Dispatched publication SHA is not the current canonical main commit.' >&2
            exit 1
          fi
          PYTHONPATH=src python scripts/validate_observatory_publication_commit.py --commit "$RELEASE_COMMIT_SHA"

      - name: Reject unbound manual release dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publication_sha == ''
        run: |
          echo 'Manual Pages release dispatch requires publication_sha.' >&2
          exit 1

      - name: Validate push-triggered Observatory publication commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Authorize Observatory release ')
        run: PYTHONPATH=src python scripts/validate_observatory_publication_commit.py --commit "$RELEASE_COMMIT_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript
        working-directory: apps/web
        run: npm run lint

      - name: Build static GitHub Pages export
        working-directory: apps/web
        run: npm run build

      - name: Audit static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          test -f apps/web/out/404.html
          test -f apps/web/out/robots.txt
          test -f apps/web/out/sitemap.xml
          test -f apps/web/out/release-manifest.json
          touch apps/web/out/.nojekyll

          if find apps/web/out -path '*data/audit/private*' -print | grep -q .; then
            echo 'Private audit path found in Pages artifact.' >&2
            exit 1
          fi
          if grep -R --binary-files=text -E 'rps_subgroup_5q_audit|data/audit/private' apps/web/out >/dev/null 2>&1; then
            echo 'Private/raw audit identifier leaked into Pages artifact.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('apps/web/out/release-manifest.json').read_text())
          expected = {
              'hostingTarget': 'github-pages',
              'dataMode': 'derived_only',
              'commitSha': os.environ['RELEASE_COMMIT_SHA'],
              'siteBaseUrl': 'https://fraware.github.io/ai-adoption-us',
              'analytics': 'disabled',
              'clientMonitoring': 'disabled',
              'sourceBytesPublished': False,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}')
          PY

          grep -F 'https://fraware.github.io/ai-adoption-us/sitemap.xml' apps/web/out/robots.txt >/dev/null
          for url in \
            https://fraware.github.io/ai-adoption-us/ \
            https://fraware.github.io/ai-adoption-us/explore/industries \
            https://fraware.github.io/ai-adoption-us/explore/occupations \
            https://fraware.github.io/ai-adoption-us/blog/after-adoption \
            https://fraware.github.io/ai-adoption-us/methodology \
            https://fraware.github.io/ai-adoption-us/sources; do
            grep -F "$url" apps/web/out/sitemap.xml >/dev/null
          done

          grep -R --binary-files=text -F '/ai-adoption-us/_next/' apps/web/out/index.html >/dev/null

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/out

  deploy:
    name: Deploy GitHub Pages
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Authorize Observatory release ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publication_sha != '')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-audit:
    name: Audit deployed Release 1 origin
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Authorize Observatory release ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publication_sha != '')
    needs: deploy
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE_URL: https://fraware.github.io/ai-adoption-us
      DEPLOYED_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_COMMIT_SHA: ${{ inputs.publication_sha || github.sha }}
    steps:
      - name: Audit live GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit

          normalized_deployed="${DEPLOYED_PAGE_URL%/}"
          if [ "$normalized_deployed" != "$EXPECTED_BASE_URL" ]; then
            echo "Unexpected deployed page URL: $DEPLOYED_PAGE_URL" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error "$EXPECTED_BASE_URL/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'GitHub Pages origin did not become reachable.' >&2
              exit 1
            fi
            sleep 2
          done

          routes=(
            /
            /explore/industries/
            /explore/occupations/
            /blog/after-adoption/
            /methodology/
            /sources/
            /robots.txt
            /sitemap.xml
            /release-manifest.json
          )
          for route in "${routes[@]}"; do
            curl --fail --location --silent --show-error \
              --dump-header "live-audit/$(echo "$route" | tr '/.' '__').headers.txt" \
              --output "live-audit/$(echo "$route" | tr '/.' '__').body.txt" \
              "$EXPECTED_BASE_URL$route"
          done

          cp live-audit/_release-manifest_json.body.txt live-audit/release-manifest.json
          cp live-audit/_robots_txt.body.txt live-audit/robots.txt
          cp live-audit/_sitemap_xml.body.txt live-audit/sitemap.xml

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('live-audit/release-manifest.json').read_text())
          expected = {
              'hostingTarget': 'github-pages',
              'dataMode': 'derived_only',
              'commitSha': os.environ['EXPECTED_COMMIT_SHA'],
              'siteBaseUrl': os.environ['EXPECTED_BASE_URL'],
              'analytics': 'disabled',
              'clientMonitoring': 'disabled',
              'sourceBytesPublished': False,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'live manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}')
          PY

          grep -F 'User-agent: *' live-audit/robots.txt >/dev/null || \
            grep -F 'User-Agent: *' live-audit/robots.txt >/dev/null
          grep -F 'Allow: /' live-audit/robots.txt >/dev/null
          grep -F "$EXPECTED_BASE_URL/sitemap.xml" live-audit/robots.txt >/dev/null

          for url in \
            "$EXPECTED_BASE_URL/" \
            "$EXPECTED_BASE_URL/explore/industries" \
            "$EXPECTED_BASE_URL/explore/occupations" \
            "$EXPECTED_BASE_URL/blog/after-adoption" \
            "$EXPECTED_BASE_URL/methodology" \
            "$EXPECTED_BASE_URL/sources"; do
            grep -F "$url" live-audit/sitemap.xml >/dev/null
          done

          homepage='live-audit/_.body.txt'
          if grep -Eiq 'googletagmanager|google-analytics|segment\.com|mixpanel|posthog|sentry|datadog|newrelic' "$homepage"; then
            echo 'Unexpected third-party analytics/monitoring identifier found in delivered homepage.' >&2
            exit 1
          fi
          if grep -Eiq 'data/audit/private|rps_subgroup_5q_audit|FRED_API_KEY' "$homepage" live-audit/release-manifest.json; then
            echo 'Private/raw/secret identifier found in delivered public content.' >&2
            exit 1
          fi

          for private_path in \
            /data/audit/private/rps_subgroup_5q_audit.json \
            /rps_subgroup_5q_audit.json \
            /api/rps/raw; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$EXPECTED_BASE_URL$private_path")
            if [ "$status" != '404' ]; then
              echo "Private/raw path did not fail closed on GitHub Pages: ${private_path} -> ${status}" >&2
              exit 1
            fi
          done

          {
            echo "audit_timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "commit_sha=$EXPECTED_COMMIT_SHA"
            echo "deployed_page_url=$DEPLOYED_PAGE_URL"
            echo "expected_base_url=$EXPECTED_BASE_URL"
            echo 'data_mode=derived_only'
            echo 'analytics=disabled'
            echo 'client_monitoring=disabled'
            echo 'source_bytes_published=false'
            echo 'application_controlled_http_security_headers=false'
            echo 'header_and_cache_observations_follow'
          } > live-audit/summary.txt
          cat live-audit/_.headers.txt >> live-audit/summary.txt
          cat live-audit/_release-manifest_json.headers.txt >> live-audit/summary.txt

      - name: Upload live deployment audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-g3-live-pages-audit
          path: live-audit
          if-no-files-found: error
          retention-days: 90
