name: Q2 2026 CPS research execution

on:
  push:
    branches:
      - research/cps-q2-2026-program

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and development checks
        run: python -m pip install -e '.[dev]'

      - name: Normalize and validate code before official-data execution
        run: |
          set -euo pipefail
          ruff check --fix tests/test_cps.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q tests/test_cps.py tests/test_composition.py
          ruff check src tests scripts

      - name: Execute official April-June 2026 CPS composition
        env:
          SOURCE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cps-q2-2026
          mkdir -p /tmp/cps-q2-2026
          PYTHONPATH=src python scripts/execute_cps_composition.py \
            --year 2026 \
            --quarter 2 \
            --input-dir /tmp/cps-q2-2026 \
            --output-dir data/derived/composition/cps-q2-2026 \
            --validation-report docs/validation/CPS_Q2_2026_COMPOSITION_EXECUTION.md \
            --coverage-gate 0.98 \
            --population-sanity-min 100000000 \
            --population-sanity-max 200000000 \
            --source-build-commit "$SOURCE_BUILD_COMMIT" \
            --download-missing

      - name: Verify raw CPS inputs are not staged
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E 'apr26pub|may26pub|jun26pub'; then
            echo 'Raw CPS public-use input unexpectedly entered repository worktree.' >&2
            exit 1
          fi

      - name: Commit normalized test and generated research artifacts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_cps.py \
            data/derived/composition/cps-q2-2026 \
            docs/validation/CPS_Q2_2026_COMPOSITION_EXECUTION.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Execute official Q2 2026 CPS composition weights'
          git push origin HEAD:research/cps-q2-2026-program
